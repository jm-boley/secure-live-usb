# This file enforces security hardening options for /tmp filesystem mounts
# These options help prevent common attack vectors and reduce system exposure

[Mount]
# Security options:
# nodev    - Prevent device file creation in /tmp
# nosuid   - Prevent suid/sgid binaries from being honored in /tmp
# noexec   - Prevent direct execution of any binaries in /tmp
#
# Benefits:
# - Prevents privilege escalation via suid/sgid binaries in /tmp
# - Blocks creation of malicious device files
# - Stops direct execution of downloaded or temp files
# - Reduces attack surface from /tmp-based exploits
Options=nodev,nosuid,noexec


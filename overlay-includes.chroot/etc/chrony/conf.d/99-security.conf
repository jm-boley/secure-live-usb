# Stricter time jump limits
maxdistance 1.0
maxjitter 0.1
maxchange 1000 0 0

# More frequent updates for better accuracy
minpoll 4
maxpoll 8

# Increase sampling for better detection of time manipulation
acquisitionport 0
maxsamples 32

# Prevent time manipulation via hardware clock
noclientlog
noreset

# Disable potentially dangerous features
nosystemcert
nolinuxcaps

# Enhanced logging for forensics
log rawmeasurements
logbanner 1

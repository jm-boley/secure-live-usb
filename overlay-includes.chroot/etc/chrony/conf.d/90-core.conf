# Core chrony configuration for all spins
# Provides secure defaults for time synchronization

# Use secure NTP pool as default source
pool 2.debian.pool.ntp.org iburst nts

# Security settings
dumponexit no
dumpdir /var/lib/chrony
cmdport 0
lock_all
sched_priority 1
makestep 1 3

# Logging configuration
logdir /var/log/chrony
log measurements statistics tracking
logchange 0.5

# Restrict access to local system only
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
allow 127.0.0.1
allow ::1
deny all

# Time accuracy settings
maxupdateskew 100.0
rtcsync

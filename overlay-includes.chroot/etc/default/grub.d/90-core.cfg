# Core GRUB security settings for all spins
# Settings in this file establish baseline security that benefits both DevOps and Security spins

GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT } \
    quiet loglevel=0 \
    slab_nomerge=1 \
    init_on_alloc=1 \
    init_on_free=1 \
    page_alloc.shuffle=1 \
    pti=on \
    randomize_kstack_offset=on \
    vsyscall=none \
    debugfs=no-mount \
    lockdown=confidentiality \
    iommu=force \
    iommu.strict=1 \
    spectre_v2=on \
    spec_store_bypass_disable=on \
    mds=full \
    slub_debug=F \
    module.sig_enforce=1"

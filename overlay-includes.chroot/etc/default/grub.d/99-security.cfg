# Allow boot parameter verification
GRUB_TIMEOUT=5
GRUB_HIDDEN_TIMEOUT=
GRUB_HIDDEN_TIMEOUT_QUIET=false

# Additional security-specific kernel parameters
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} \
    splash \
    audit=1 \
    audit_backlog_limit=8192 \
    apparmor=1 \
    security=apparmor \
    mce=0 \
    page_poison=1"

# Explicitly disable recovery mode
GRUB_DISABLE_RECOVERY=true

# auditd.conf - Optimized for Live environment with limited resources

# Log file location and format
log_file = /var/log/audit/audit.log
log_format = RAW
log_group = adm

# Minimal log rotation for Live environment
max_log_file = 4
max_log_file_action = ROTATE
num_logs = 2

# Dispatch settings
disp_qos = lossy
dispatcher = /sbin/audispd

# Performance tuning for Live environment
flush = INCREMENTAL_ASYNC
freq = 100

# Conservative space management
admin_space_left = 25
admin_space_left_action = SYSLOG
space_left = 50
space_left_action = SYSLOG
disk_full_action = SYSLOG
disk_error_action = SYSLOG

# Basic logging configuration
write_logs = yes
name_format = NONE

# Disable network listener
tcp_listen_port = 0

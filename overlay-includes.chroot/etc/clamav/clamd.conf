# Main Settings
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock

# Performance settings balanced for DevOps workloads
MaxThreads 4
MaxFileSize 100M
MaxScanSize 100M

# Exclude common development paths
ExcludePath ^/var/lib/docker/
ExcludePath ^/var/lib/containers/
ExcludePath ^/home/.*/workspace/
ExcludePath ^/home/.*/.cache/
ExcludePath ^/tmp/

# On-access scanning (disabled by default for DevOps performance)
OnAccessIncludePath /home
OnAccessExcludePath /home/*/workspace
OnAccessExcludePath /home/*/.cache
OnAccessPrevention false
OnAccessExtraScanning false
